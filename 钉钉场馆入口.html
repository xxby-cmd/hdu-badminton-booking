<main><h1>在电脑钉钉打开场馆速约</h1><p>请保持电脑钉钉已登录。点击下面的按钮，使用钉钉窗口打开学校场馆首页。</p>
<a class="button" href="dingtalk://dingtalkclient/page/link?url=https%3A%2F%2Fsportmeta.hdu.edu.cn%2Fbook%2Fdingtalk%2F%23%2F&amp;pc_slide=true">在钉钉里打开场馆首页</a><a class="secondary" href="dingtalk://dingtalkclient/page/link?url=https%3A%2F%2Fsportmeta.hdu.edu.cn%2Fbook%2Fdingtalk%2F%23%2F&amp;popup_wnd=true&amp;width=1080&amp;height=860&amp;title=%E5%9C%BA%E9%A6%86%E9%80%9F%E7%BA%A6">改用钉钉独立窗口打开</a>
